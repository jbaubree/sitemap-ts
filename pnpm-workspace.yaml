minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

allowBuilds:
  esbuild: true
  pnpm: true
  simple-git-hooks: true

permissions:
  taze:
    skills: true

skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
